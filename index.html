<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D UI Design Inspiration</title>
    <style>
        body {
            background-color: #EFEFEF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .card {
            background: #FAFAFA;
            width: 480px;
            height: 480px;
            border-radius: 80px;
            box-shadow:
                -20px -20px 60px rgba(255, 255, 255, 0.8),
                20px 20px 60px rgba(0, 0, 0, 0.05),
                inset 0 0 0 4px rgba(255, 255, 255, 1);
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 25px;
            padding: 50px;
            box-sizing: border-box;
            position: relative;
        }

        .circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
        }

        /* 3D Effects via inset shadows */
        .circle::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            box-shadow:
                inset -8px -8px 16px rgba(0, 0, 0, 0.15),
                inset 8px 8px 16px rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        .yellow {
            background-color: #FFDE00;
            box-shadow: 0 20px 30px rgba(255, 222, 0, 0.3);
            grid-column: 1;
            grid-row: 1;
        }

        .pink {
            background-color: #FFA5A0;
            box-shadow: 0 20px 30px rgba(255, 165, 160, 0.4);
            grid-column: 1;
            grid-row: 2;
        }

        .green {
            background-color: #005F4B;
            box-shadow: 0 20px 30px rgba(0, 95, 75, 0.4);
            grid-column: 2;
            grid-row: 2;
        }

        .blue {
            background-color: #558092;
            box-shadow: 0 20px 30px rgba(85, 128, 146, 0.4);
            grid-column: 1;
            grid-row: 3;
        }

        .red {
            background-color: #E8002E;
            box-shadow: 0 20px 30px rgba(232, 0, 46, 0.4);
            grid-column: 2;
            grid-row: 3;
        }

        .brown {
            background-color: #935B10;
            box-shadow: 0 20px 30px rgba(147, 91, 16, 0.4);
            grid-column: 3;
            grid-row: 3;
        }

        .plus-container {
            grid-column: 3;
            grid-row: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform: translate(-10px, 10px);
        }

        .plus {
            position: relative;
            width: 70px;
            height: 70px;
        }

        .plus::before, .plus::after {
            content: '';
            position: absolute;
            background: #4A4F58;
            border-radius: 10px;
            box-shadow:
                0 10px 15px rgba(74, 79, 88, 0.3),
                inset -3px -3px 6px rgba(0, 0, 0, 0.3),
                inset 3px 3px 6px rgba(255, 255, 255, 0.2);
        }

        /* Horizontal bar */
        .plus::before {
            top: 25px;
            left: 0;
            width: 70px;
            height: 20px;
        }

        /* Vertical bar */
        .plus::after {
            top: 0;
            left: 25px;
            width: 20px;
            height: 70px;
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="circle yellow"></div>

        <div class="plus-container">
            <div class="plus"></div>
        </div>

        <div class="circle pink"></div>
        <div class="circle green"></div>

        <div class="circle blue"></div>
        <div class="circle red"></div>
        <div class="circle brown"></div>
    </div>
</body>
</html>
